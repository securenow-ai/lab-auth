# Every hour, a coding agent reads the last hour of error logs from SecureNow, fixes what it can, and opens
# one pull request per root cause. Nothing merges without a human review.
#
# Setup (once):
#   1. SecureNow dashboard -> Settings -> API Keys: create a key with the "Read Only" preset and save it as
#      the repository secret SECURENOW_API_KEY. The agent can read logs and traces but change nothing.
#   2. Run `claude setup-token` and save the token as the repository secret CLAUDE_CODE_OAUTH_TOKEN
#      (or use ANTHROPIC_API_KEY with `anthropic_api_key:` below).
# GitHub runs scheduled workflows from the default branch only.
name: Hourly error fixes

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hourly-error-fixes
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lab_auth_test
          POSTGRES_PASSWORD: ci_only_not_a_deployment_secret
          POSTGRES_DB: lab_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_auth_test -d lab_auth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SECURENOW_API_KEY: ${{ secrets.SECURENOW_API_KEY }}
      TEST_DATABASE_URL: postgresql://lab_auth_test:ci_only_not_a_deployment_secret@127.0.0.1:5432/lab_auth_test
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the SecureNow MCP tools to list the error logs from the last hour for the lab-auth app,
            across all environments. Group them by root cause. Skip any cause that already has an open pull
            request (check with `gh pr list`). For each new cause: create a branch named fix/<short-slug>
            from the current branch, make the smallest correct fix, add a regression test, run `npm test`,
            commit, push the branch, and open a pull request with `gh pr create` that quotes the error, the
            environments it hits and how often it happened. If there are no new errors, do nothing.
          claude_args: |
            --mcp-config .github/securenow-mcp.json
            --max-turns 60
            --allowedTools "mcp__securenow__securenow_apps_list,mcp__securenow__securenow_logs_list,mcp__securenow__securenow_logs_for_trace,mcp__securenow__securenow_traces_show,Read,Glob,Grep,Edit,Write,Bash(npm test:*),Bash(git:*),Bash(gh pr list:*),Bash(gh pr create:*)"
