name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lab_auth_test
          POSTGRES_PASSWORD: ci_only_not_a_deployment_secret
          POSTGRES_DB: lab_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_auth_test -d lab_auth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: node scripts/check-secrets.mjs
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://lab_auth_test:ci_only_not_a_deployment_secret@127.0.0.1:5432/lab_auth_test
      - run: npm audit --audit-level=high
      - run: docker build --tag lab-auth:ci .
